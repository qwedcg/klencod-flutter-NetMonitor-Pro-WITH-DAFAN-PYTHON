plugins {
    id 'com.android.application'
}

// Copy the Python tool from the repository root into APK assets.
tasks.register('syncDafanTool', Copy) {
    from(rootProject.file('DAFAN_TOOL.py'))
    into(layout.buildDirectory.dir('generated/assets/dafan'))
}

android {
    namespace 'com.netmonitor.pro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.netmonitor.pro'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    sourceSets {
        main {
            assets.srcDir(layout.buildDirectory.dir('generated/assets/dafan'))
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild') {
    dependsOn(tasks.named('syncDafanTool'))
}
